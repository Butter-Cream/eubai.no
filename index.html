        <style>
            .gothic-text {
                font-family: "Old London", sans-serif;
            }
            body {
                background-color: #190945;
                font-family: 'Times New Roman', Times, serif, sans-serif;
                margin: 0;
                padding: 0;
            }
            .spacer {
                height: 10px;

            .spacer2{
                height: 50px;

            h1 {
                background-color: #000000;

            }
            h2 {
                background-color: #000000;
                color: white;
                text-align: center;
                font-size: 50px;
            }
            ul {
                list-style-type: none;
                padding: 0;
            }
            ul p {
                margin: 0px 0;
            }
            .section-one {
                background-color: #190945;
                color: white;
            }
            .section-two {
                background-color: #000000;

            }
            .button {
                background-color: #000000;
                color: white;
                border: 5px solid #000000;
                border-radius: 5px;
                padding: 10px 20px;
                text-align: center;
                text-decoration: none;
                display: inline-block;
                font:100% "Old London", sans-serif;
                font-size: 30px;
                margin: 4px 2px;
                cursor: pointer;
                position: relative;
                transition: transform 0.5s ease;
            }
            .button2 {
                background-color: #190945;
                color: white;
                border: 5px solid #190945;
                border-radius: 5px;
                padding: 10px 20px;
                text-align: center;
                text-decoration: none;
                display: inline-block;
                font:100% "Old London", sans-serif;
                font-size: 30px;
                margin: 4px 2px;
                cursor: pointer;
                position: relative;
                transition: transform 0.5s ease;
            }
            .button:hover {
                transform: scale(1.15);
            }
            .button2:hover {
                transform: scale(1.15);
            }
            .navitem {
                margin-left: 20%;
                margin-right: 20%;
            }
            .floatleft {
                float: left;
                clear: left;
                margin-left: 20px;
            }
            .floatright {
                float: right;
                clear: right;
                margin-right: 20px;
            }
